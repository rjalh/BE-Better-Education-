<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
<title id="title">Бебешка — барашек-помощник Better Education</title>
<desc id="desc">Улыбающийся пушистый белый барашек с золотыми рожками в синем худи машет рукой и держит учебник</desc>
<defs>
 <linearGradient id="horn" x1=".1" y1="0" x2=".95" y2="1"><stop stop-color="#fff0c1"/><stop offset=".5" stop-color="#d3a05c"/><stop offset="1" stop-color="#aa713f"/></linearGradient>
