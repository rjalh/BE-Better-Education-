 <linearGradient id="book" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a3c9f9"/><stop offset="1" stop-color="#578bcf"/></linearGradient>
 <radialGradient id="face"><stop stop-color="#fff"/><stop offset=".75" stop-color="#fffaf8"/><stop offset="1" stop-color="#e9e2eb"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#615493" flood-opacity=".16"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
